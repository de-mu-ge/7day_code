<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>学生信息管理系统</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h2>学生信息管理系统</h2>
<div>
    姓名：<input type="text" id="name">
    年龄：<input type="text" id="age" size="4">
    成绩：<input type="text" id="score" size="4">
    <input type="hidden" id="eid">
    <button onclick="add()">添加</button>
    <button onclick="update()">保存修改</button>
</div>
<table border="1">
    <tr><th>编号</th><th>姓名</th><th>年龄</th><th>成绩</th><th>操作</th></tr>
    <tbody id="list"></tbody>
</table>
<script src="app.js"></script>
</body>
</html>
